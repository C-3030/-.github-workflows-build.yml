name: Android Debug Build

# ┌────────────────────────────────────────────────────────────────────────────┐
# │ 触发方案(最优实践,面向「迭代 + 实测」场景):                              │
# │   • workflow_dispatch —— 手动点「Run workflow」按需出 APK,可选 flavor。     │
# │   • push(master/main + ci/** 工作分支)—— 每次提交自动产出可装测试包,       │
# │     仅代码相关变更触发(忽略纯文档/资源说明)。                              │
# │   • pull_request —— 合并前自动校验能否构建。                                 │
# │ concurrency: 同一分支新推送自动取消旧运行,省 runner 时长。                  │
# └────────────────────────────────────────────────────────────────────────────┘
on:
  workflow_dispatch:
    inputs:
      flavor:
        description: "Product flavor to build"
        type: choice
        default: git
        options: [git, libre]
  push:
    branches: [master, main, "ci/**", "fix/**"]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "fastlane/metadata/**"
      - ".github/ISSUE_TEMPLATE/**"
  pull_request:
    branches: [master, main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # push / PR 无输入时默认 git flavor
      FLAVOR: ${{ github.event.inputs.flavor || 'git' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive # 需要 Ketch 子模块(:ketch)

      # Android uses ICU for regex; desktop JVM tests accept patterns Android rejects.
      - name: Check novel parser with native ICU
        run: python3 scripts/check_novel_regex.py

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false

      # debug 构建类型对所有 flavor 强制使用名为 "config" 的签名,
      # 且 app/build.gradle.kts 在配置期就会读取 rootProject 的 keystore.properties。
      #
      # 签名固定方案:keystore 存在 Actions 缓存里,只在第一次运行时生成,之后一直复用。
      # 这样多次构建签名一致,可以直接覆盖安装(不需要卸载)。
      # 缓存只有本仓库的 workflow 能读取,所以不把私钥提交进公开仓库;
      # 注意 GitHub 会清理 7 天未使用的缓存,长期不构建后缓存丢失会重新生成新密钥。
      - name: Restore signing keystore from cache
        id: keystore-cache
        uses: actions/cache@v4
        with:
          path: ci-debug.keystore
          key: pixez-debug-keystore-v1

      - name: Generate signing keystore if missing
        if: steps.keystore-cache.outputs.cache-hit != 'true'
        run: |
          keytool -genkeypair -v \
            -keystore "$GITHUB_WORKSPACE/ci-debug.keystore" \
            -alias ci -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass cicicici -keypass cicicici \
            -dname "CN=PixEz CI, OU=CI, O=PixEz, L=NA, ST=NA, C=US"

      - name: Write keystore.properties
        run: |
          cat > "$GITHUB_WORKSPACE/keystore.properties" <<EOF
          storeFile=$GITHUB_WORKSPACE/ci-debug.keystore
          storePassword=cicicici
          keyAlias=ci
          keyPassword=cicicici
          EOF

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew "test${FLAVOR^}DebugUnitTest" --stacktrace

      - name: Build ${{ env.FLAVOR }}Debug APK
        run: ./gradlew "assemble${FLAVOR^}Debug" --stacktrace

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PixEz-${{ env.FLAVOR }}-debug-${{ github.run_number }}-${{ github.sha }}
          path: app/build/outputs/apk/**/debug/*.apk
          if-no-files-found: error
          retention-days: 14
